<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#ffffff">
<title>병동 환자 관리</title>
<style>
  :root {
    --bg: #f5f5f7;
    --surface: #ffffff;
    --surface2: #f0f0f5;
    --border: #e0e0e8;
    --border2: #c8c8d8;
    --text: #1a1a2e;
    --text2: #555577;
    --text3: #999aaa;
    --accent: #2563eb;
    --accent-bg: #eff6ff;
    --accent-text: #1d4ed8;
    --success: #16a34a;
    --success-bg: #f0fdf4;
    --success-text: #15803d;
    --danger: #dc2626;
    --danger-bg: #fef2f2;
    --danger-text: #b91c1c;
    --radius-sm: 8px;
    --radius-md: 12px;
    --radius-lg: 16px;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f0f14;
      --surface: #1c1c28;
      --surface2: #252535;
      --border: #2e2e42;
      --border2: #3e3e58;
      --text: #e8e8f0;
      --text2: #9090b0;
      --text3: #55556a;
      --accent: #3b82f6;
      --accent-bg: #1e2d4a;
      --accent-text: #93c5fd;
      --success-bg: #0d2a1a;
      --success-text: #6ee7b7;
      --danger-bg: #2a0d0d;
      --danger-text: #fca5a5;
    }
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  body {
    font-family: -apple-system, 'Malgun Gothic', '맑은 고딕', BlinkMacSystemFont, sans-serif;
    background: var(--bg);
    color: var(--text);
    font-size: 14px;
    min-height: 100dvh;
    overscroll-behavior: none;
  }

  .app-bar {
    position: sticky;
    top: 0;
    z-index: 30;
    background: var(--surface);
    border-bottom: 0.5px solid var(--border);
    padding: env(safe-area-inset-top) 0 0;
  }
  .app-bar-inner {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 16px;
    gap: 10px;
  }
  .app-title { font-size: 17px; font-weight: 600; color: var(--text); }

  .ward-tabs {
    display: flex;
    gap: 4px;
    padding: 0 16px 10px;
    overflow-x: auto;
    scrollbar-width: none;
  }
  .ward-tabs::-webkit-scrollbar { display: none; }
  .tab {
    padding: 6px 16px;
    border-radius: 20px;
    border: 0.5px solid var(--border2);
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    background: var(--surface);
    color: var(--text2);
    white-space: nowrap;
    transition: all .15s;
  }
  .tab.active {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
  }

  .stats-row {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    padding: 12px 16px;
  }
  .stat-card {
    background: var(--surface);
    border-radius: var(--radius-md);
    padding: 12px 10px;
    text-align: center;
    border: 0.5px solid var(--border);
  }
  .stat-num { font-size: 24px; font-weight: 600; line-height: 1; }
  .stat-lbl { font-size: 11px; color: var(--text2); margin-top: 4px; }
  .stat-active { color: var(--success); }
  .stat-wait { color: var(--text3); }

  .section-label {
    padding: 6px 16px 6px;
    font-size: 12px;
    font-weight: 600;
    color: var(--text3);
    letter-spacing: .5px;
    text-transform: uppercase;
  }

  .patient-list { padding: 0 16px 100px; }
  .patient-card {
    background: var(--surface);
    border: 0.5px solid var(--border);
    border-radius: var(--radius-lg);
    margin-bottom: 10px;
    overflow: hidden;
  }
  .patient-card.is-waiting { opacity: .5; }

  .card-header {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 13px 14px;
    cursor: pointer;
    user-select: none;
    -webkit-user-select: none;
  }
  .card-header:active { background: var(--surface2); }

  .badge {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    font-weight: 600;
    padding: 3px 8px;
    border-radius: 6px;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .badge-m { background: var(--accent-bg); color: var(--accent-text); }
  .badge-f { background: var(--danger-bg); color: var(--danger-text); }
  .badge-wait { background: var(--surface2); color: var(--text3); }

  .card-room { font-size: 12px; color: var(--text2); flex-shrink: 0; }
