<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#ffffff">
<title>병동 환자 관리</title>
<style>
  :root {
    --bg: #f5f5f7;
    --surface: #ffffff;
    --surface2: #f0f0f5;
    --border: #e0e0e8;
    --border2: #c8c8d8;
    --text: #1a1a2e;
    --text2: #555577;
    --text3: #999aaa;
    --accent: #2563eb;
    --accent-bg: #eff6ff;
    --accent-text: #1d4ed8;
    --success: #16a34a;
    --success-bg: #f0fdf4;
    --success-text: #15803d;
    --danger: #dc2626;
    --danger-bg: #fef2f2;
    --danger-text: #b91c1c;
    --radius-sm: 8px;
    --radius-md: 12px;
    --radius-lg: 16px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f0f14;
      --surface: #1c1c28;
      --surface2: #252535;
      --border: #2e2e42;
      --border2: #3e3e58;
      --text: #e8e8f0;
      --text2: #9090b0;
      --text3: #55556a;
      --accent: #3b82f6;
      --accent-bg: #1e2d4a;
      --accent-text: #93c5fd;
      --success-bg: #0d2a1a;
      --success-text: #6ee7b7;
      --danger-bg: #2a0d0d;
      --danger-text: #fca5a5;
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body { font-family: -apple-system, 'Malgun Gothic', '맑은 고딕', BlinkMacSystemFont, sans-serif; background: var(--bg); color: var(--text); font-size: 14px; min-height: 100dvh; overscroll-behavior: none; }
  .app-bar { position: sticky; top: 0; z-index: 30; background: var(--surface); border-bottom: 0.5px solid var(--border); padding: env(safe-area-inset-top) 0 0; }
  .app-bar-inner { display: flex; align-items: center; justify-content: space-between; padding: 10px 16px; gap: 10px; }
  .app-title { font-size: 17px; font-weight: 600; color: var(--text); }
  .sync-dot { width: 8px; height: 8px; border-radius: 50%; background: #ccc; display: inline-block; margin-left: 6px; vertical-align: middle; transition: background .3s; }
  .sync-dot.connected { background: var(--success); }
  .sync-dot.syncing { background: #f59e0b; }
  .ward-tabs { display: flex; gap: 4px; padding: 0 16px 10px; overflow-x: auto; scrollbar-width: none; }
  .ward-tabs::-webkit-scrollbar { display: none; }
  .tab { padding: 6px 16px; border-radius: 20px; border: 0.5px solid var(--border2); font-size: 13px; font-weight: 500; cursor: pointer; background: var(--surface); color: var(--text2); white-space: nowrap; transition: all .15s; }
  .tab.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  .stats-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; padding: 12px 16px; position: sticky; top: var(--app-bar-height, 88px); z-index: 29; background: var(--bg); }
  .stat-card { background: var(--surface); border-radius: var(--radius-md); padding: 12px 10px; text-align: center; border: 0.5px solid var(--border); }
  .stat-num { font-size: 24px; font-weight: 600; line-height: 1; }
  .stat-lbl { font-size: 11px; color: var(--text2); margin-top: 4px; }
  .stat-active { color: var(--success); }
  .stat-wait { color: var(--text3); }
  .section-label { padding: 6px 16px 6px; font-size: 12px; font-weight: 600; color: var(--text3); letter-spacing: .5px; text-transform: uppercase; }
  .patient-list { padding: 0 16px 100px; }
  .patient-card { background: var(--surface); border: 0.5px solid var(--border); border-radius: var(--radius-lg); margin-bottom: 10px; overflow: hidden; }
  .patient-card.is-waiting { opacity: .5; }
  .card-header { display: flex; align-items: center; gap: 8px; padding: 13px 14px; cursor: pointer; user-select: none; -webkit-user-select: none; }
  .card-header:active { background: var(--surface2); }
  .badge { display: inline-flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 600; padding: 3px 8px; border-radius: 6px; white-space: nowrap; flex-shrink: 0; }
  .badge-m { background: var(--accent-bg); color: var(--accent-text); }
  .badge-f { background: var(--danger-bg); color: var(--danger-text); }
  .badge-wait { background: var(--surface2); color: var(--text3); }
  .card-room { font-size: 12px; color: var(--text2); flex-shrink: 0; }
  .card-name { font-size: 15px; font-weight: 500; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .card-days { font-size: 12px; color: var(--text2); flex-shrink: 0; min-width: 30px; text-align: right; }
  .chevron { font-size: 18px; color: var(--text3); transition: transform .2s; flex-shrink: 0; }
  .chevron.open { transform: rotate(180deg); }
  .card-body { border-top: 0.5px solid var(--border); display: none; padding: 12px 14px; }
  .card-body.open { display: block; }
  .info-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px 14px; }
  .info-item { display: flex; flex-direction: column; gap: 2px; }
  .info-item.full { grid-column: 1/-1; }
  .info-lbl { font-size: 10px; font-weight: 600; color: var(--text3); letter-spacing: .3px; }
  .info-val { font-size: 13px; color: var(--text); }
  .info-val.muted { color: var(--text3); }
  .chip { display: inline-flex; align-items: center; gap: 3px; padding: 2px 8px; border-radius: 6px; font-size: 12px; font-weight: 500; }
  .chip-blue { background: var(--accent-bg); color: var(--accent-text); }
  .chip-green { background: var(--success-bg); color: var(--success-text); }
  .card-actions { display: flex; gap: 8px; margin-top: 12px; justify-content: flex-end; flex-wrap: wrap; }
  .btn-edit { padding: 7px 18px; border-radius: var(--radius-sm); border: 0.5px solid var(--border2); background: var(--surface2); color: var(--text); font-size: 13px; font-weight: 500; cursor: pointer; }
  .btn-del { padding: 7px 18px; border-radius: var(--radius-sm); border: 0.5px solid var(--danger); background: var(--danger-bg); color: var(--danger-text); font-size: 13px; font-weight: 500; cursor: pointer; }
  .btn-edit:active, .btn-del:active { opacity: .7; }
  .btn-discharge { padding: 7px 18px; border-radius: var(--radius-sm); border: 0.5px solid var(--success); background: var(--success-bg); color: var(--success-text); font-size: 13px; font-weight: 500; cursor: pointer; }
  .btn-discharge:active { opacity: .7; }
  .btn-move { padding: 7px 18px; border-radius: var(--radius-sm); border: 0.5px solid var(--border2); background: var(--surface2); color: var(--text); font-size: 13px; font-weight: 500; cursor: pointer; }
  .btn-move:active { opacity: .7; }
  .fab { position: fixed; bottom: calc(24px + env(safe-area-inset-bottom)); right: 20px; width: 56px; height: 56px; border-radius: 50%; background: var(--accent); color: #fff; border: none; font-size: 28px; font-weight: 300; cursor: pointer; box-shadow: 0 4px 16px rgba(37,99,235,.35); display: flex; align-items: center; justify-content: center; z-index: 20; transition: transform .15s; }
  .fab:active { transform: scale(.92); }
  .sheet-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 50; display: none; align-items: flex-end; }
  .sheet-backdrop.open { display: flex; }
  .sheet { background: var(--surface); border-radius: 20px 20px 0 0; width: 100%; max-height: 92dvh; overflow-y: auto; padding-bottom: calc(24px + env(safe-area-inset-bottom)); animation: slideUp .22s cubic-bezier(.32,.72,0,1); -webkit-overflow-scrolling: touch; }
  @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
  .sheet-handle { width: 36px; height: 4px; background: var(--border2); border-radius: 2px; margin: 12px auto 0; }
  .sheet-title { padding: 12px 18px 12px; font-size: 16px; font-weight: 600; border-bottom: 0.5px solid var(--border); }
  .sheet-body { padding: 16px 18px 0; }
  .form-group { margin-bottom: 14px; }
  .form-group label { display: block; font-size: 12px; font-weight: 600; color: var(--text2); margin-bottom: 5px; }
  .form-group input, .form-group select { width: 100%; padding: 11px 12px; border-radius: var(--radius-sm); border: 0.5px solid var(--border2); background: var(--surface2); color: var(--text); font-size: 15px; font-family: inherit; outline: none; -webkit-appearance: none; appearance: none; }
  .form-group input:focus, .form-group select:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(37,99,235,.15); }
  .form-row { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
  .sheet-btns { display: flex; gap: 10px; padding: 14px 18px 0; border-top: 0.5px solid var(--border); margin-top: 16px; }
  .btn-cancel-sheet { flex: 1; padding: 12px; border-radius: var(--radius-sm); border: 0.5px solid var(--border2); background: var(--surface2); color: var(--text); font-size: 15px; font-weight: 500; cursor: pointer; }
  .btn-save-sheet { flex: 2; padding: 12px; border-radius: var(--radius-sm); border: none; background: var(--accent); color: #fff; font-size: 15px; font-weight: 600; cursor: pointer; }
  .btn-cancel-sheet:active, .btn-save-sheet:active { opacity: .8; }
  .confirm-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 60; display: none; align-items: center; justify-content: center; padding: 24px; }
  .confirm-backdrop.open { display: flex; }
  .confirm-box { background: var(--surface); border-radius: var(--radius-lg); padding: 22px 20px 18px; width: 100%; max-width: 320px; }
  .confirm-title { font-size: 16px; font-weight: 600; margin-bottom: 6px; }
  .confirm-msg { font-size: 13px; color: var(--text2); margin-bottom: 18px; line-height: 1.5; }
  .confirm-btns { display: flex; gap: 8px; }
  .btn-cc { flex: 1; padding: 10px; border-radius: var(--radius-sm); border: 0.5px solid var(--border2); background: var(--surface2); color: var(--text); font-size: 14px; cursor: pointer; }
  .btn-cd { flex: 1; padding: 10px; border-radius: var(--radius-sm); border: none; background: var(--danger); color: #fff; font-size: 14px; font-weight: 600; cursor: pointer; }
  .empty-state { text-align: center; padding: 48px 20px; color: var(--text3); }
  .empty-icon { font-size: 44px; margin-bottom: 12px; }
  .empty-text { font-size: 14px; }
  .toast { position: fixed; bottom: calc(90px + env(safe-area-inset-bottom)); left: 50%; transform: translateX(-50%) translateY(20px); background: var(--text); color: var(--surface); padding: 10px 20px; border-radius: 24px; font-size: 13px; font-weight: 500; white-space: nowrap; opacity: 0; transition: all .25s; z-index: 80; pointer-events: none; }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .badge-dr-kim { background: #e0f0ff; color: #1a5fa8; font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 6px; flex-shrink: 0; }
  .badge-dr-kwon { background: #f0e8ff; color: #6b21a8; font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 6px; flex-shrink: 0; }
  .history-btns { display: flex; gap: 4px; }
  .btn-history { padding: 5px 10px; border-radius: var(--radius-sm); border: 0.5px solid var(--border2); background: var(--surface); color: var(--text2); font-size: 16px; cursor: pointer; transition: all .15s; }
  .btn-history:disabled { opacity: .25; cursor: default; }
  .btn-history:not(:disabled):active { background: var(--surface2); }
  .mini-tag { display: inline-flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 700; padding: 2px 6px; border-radius: 5px; white-space: nowrap; flex-shrink: 0; cursor: pointer; }
  .mini-red { background: var(--danger-bg); color: var(--danger-text); border: 0.5px solid var(--danger); }
  .mini-green { background: var(--success-bg); color: var(--success-text); border: 0.5px solid var(--success); }
  .mini-pink { background: #eff6ff; color: #1d4ed8; border: 0.5px solid #3b82f6; }
  .mini-gray { background: #e0e0e0; color: #424242; border: 0.5px solid #9e9e9e; }
  .loading-overlay { position: fixed; inset: 0; background: var(--bg); z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; }
  .loading-spinner { width: 36px; height: 36px; border: 3px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loading-text { font-size: 14px; color: var(--text2); }

  .inline-edit { width:100%; background:var(--surface2); border:0.5px solid var(--border2); border-radius:var(--radius-sm); padding:6px 10px; font-size:13px; color:var(--text); font-family:inherit; outline:none; }
  .inline-edit:focus { border-color:var(--accent); box-shadow:0 0 0 2px rgba(37,99,235,.15); }

  .form-group select.empty-select {
    background: #fffbeb;
    border-color: #f59e0b;
  }
  input#f_admDate:not([value]),
  input#f_admDate[value=""] {
    background: #fffbeb;
    border-color: #f59e0b;
  }

.btn-ward-edit { padding: 5px 12px; border-radius: var(--radius-sm); border: 0.5px solid var(--border2); background: var(--surface); color: var(--text2); font-size: 12px; cursor: pointer; }
  .btn-ward-edit.active { background: var(--danger-bg); color: var(--danger-text); border-color: var(--danger); }
  .patient-card.selected { border-color: var(--danger); background: var(--danger-bg); }
  .check-box { width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--border2); flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 12px; }
  .patient-card.selected .check-box { background: var(--danger); border-color: var(--danger); color: #fff; }

.tab.active #badge-discharge { background: #fff; color: #dc2626; }
  
</style>
</head>
<body>

<!-- 로그인 화면 -->
<div id="loginScreen" style="display:none;position:fixed;inset:0;background:var(--bg);z-index:200;flex-direction:column;align-items:center;justify-content:center;gap:20px">
  <div style="font-size:40px">🏥</div>
  <div style="font-size:20px;font-weight:600;color:var(--text)">병동 환자 관리</div>
  <div style="font-size:13px;color:var(--text2)">허용된 계정으로만 접속 가능합니다</div>
  <button onclick="googleLogin()" style="display:flex;align-items:center;gap:10px;padding:12px 24px;border-radius:var(--radius-md);border:0.5px solid var(--border2);background:var(--surface);color:var(--text);font-size:15px;font-weight:500;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.1)">
    <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="20" height="20">
    Google로 로그인
  </button>
</div>
  
<div class="loading-overlay" id="loadingOverlay">
  <div class="loading-spinner"></div>
  <div class="loading-text">데이터 불러오는 중...</div>
</div>


<div id="appContent" style="display:none">  
<div class="app-bar">
  <div class="app-bar-inner">
    <span class="app-title">🏥 병동 환자 관리 <span style="font-size:11px;font-weight:400;color:var(--text3)">(v10.2)</span><span class="sync-dot" id="syncDot" title="동기화 상태"></span></span>
    <div style="display:flex;align-items:center;gap:8px">
      <div class="history-btns">
        <button class="btn-history" id="btn-undo" onclick="undo()" title="되돌리기" disabled>↩</button>
        <button class="btn-history" id="btn-redo" onclick="redo()" title="앞으로" disabled>↪</button>
      </div>
      <span id="dateDisplay" style="font-size:12px;color:var(--text2)"></span>
      <button onclick="googleLogout()" style="font-size:11px;color:var(--text3);background:none;border:0.5px solid var(--border2);border-radius:var(--radius-sm);padding:3px 8px;cursor:pointer">로그아웃</button>
      <button class="btn-ward-edit" id="btnWardEdit" onclick="toggleEditMode()" style="display:none">편집</button>
    </div>
  </div>
  <div class="ward-tabs">
    <button class="tab active" onclick="selectWard('85w',this)">85w</button>
    <button class="tab" onclick="selectWard('75w',this)">75w</button>
    <button class="tab" onclick="selectWard('62w',this)">62w</button>
    <button class="tab" onclick="selectWard('퇴원환자',this)">퇴원환자 <span id="badge-discharge" style="display:none;background:#dc2626;color:#fff;font-size:10px;font-weight:700;padding:1px 6px;border-radius:10px;margin-left:2px">0</span></button>
  </div>
</div>

<div class="stats-row" id="statsRow" style="grid-template-columns:repeat(3,1fr)">
  <div class="stat-card" id="stat-card-total"><div class="stat-num" id="stat-total">0</div><div class="stat-lbl">전체 병상</div></div>
  <div class="stat-card" id="stat-card-active"><div class="stat-num stat-active" id="stat-active">0</div><div class="stat-lbl">입원 중</div></div>
  <div class="stat-card" id="stat-card-wait"><div class="stat-num" style="color:var(--danger)" id="stat-wait">0</div><div class="stat-lbl">돌봄·경과 미비</div></div>
  <div class="stat-card" id="stat-card-pending"><div class="stat-num" style="color:#1d4ed8" id="stat-pending">0</div><div class="stat-lbl">향후 작성 대기</div></div>
  <div class="stat-card" id="stat-card-discharge-lack" style="display:none"><div class="stat-num" style="color:var(--danger)" id="stat-discharge-lack">0</div><div class="stat-lbl">퇴원 미비</div></div>
  <div class="stat-card" id="stat-card-death-lack" style="display:none"><div class="stat-num" style="color:var(--danger)" id="stat-death-lack">0</div><div class="stat-lbl">임종 미비</div></div>
</div>

<div class="section-label" id="sectionLabel">85w 병동</div>
<div class="patient-list" id="patientList"></div>
<button class="fab" onclick="openSheet(null)" aria-label="환자 추가">+</button>

<div class="sheet-backdrop" id="sheetBackdrop" onclick="onBackdropClick(event)">
  <div class="sheet" onclick="event.stopPropagation()">
    <div class="sheet-handle"></div>
    <div class="sheet-title" id="sheetTitle">환자 등록</div>
    <div class="sheet-body">
      <input type="hidden" id="f_id">
      <div class="form-row">
        <div class="form-group"><label>병실번호 *</label><input type="text" id="f_room" placeholder="850101" inputmode="numeric"></div>
        <div class="form-group"><label>성별 선택</label>
          <select id="f_type"><option value="">성별</option><option value="대기">대기</option><option value="성인남">성인(남)</option><option value="성인여">성인(여)</option></select></div>
      </div>
      <div class="form-row">
        <div class="form-group"><label>성명</label><input type="text" id="f_name" placeholder="홍길동"></div>
        <div class="form-group"><label>재원일수</label><input type="text" id="f_days" placeholder="자동계산" readonly style="background:var(--border);color:var(--text2);cursor:not-allowed""></div>
      </div>
      <div class="form-group"><label>퇴원기록</label><select id="f_discharge"><option value="">-</option><option value="퇴원기록">퇴원기록</option></select></div>
      <div class="form-group"><label>임종기록</label><select id="f_deathNote"><option value="">-</option><option value="임종기록">임종기록</option><option value="임종 이외">임종 이외</option></select></div>
      <div class="form-row">
        <div class="form-group"><label>돌봄상담</label><select id="f_careConsult"><option value="">-</option><option value="o">o</option></select></div>
        <div class="form-group"><label>경과기록</label><select id="f_progressNote"><option value="n">n</option><option value="o">o</option><option value="-">-</option></select></div>
      </div>
      <div class="form-group"><label>가정형/재입원</label><select id="f_readmit"><option value="">-</option><option value="가정형/재입원">가정형/재입원</option></select></div>
      <div class="form-group"><label>병명</label><input type="text" id="f_disease" placeholder="예) Rectal ca."></div>
      <div class="form-group"><label>특이사항</label><input type="text" id="f_note" placeholder="예) 장루, 낙상위험 등"></div>
      <div class="form-row">
        <div class="form-group"><label>입원일</label><input type="date" id="f_admDate"></div>
        <div class="form-group"><label>담당의</label><select id="f_doctor"><option value="">-</option><option value="김성민">김성민</option><option value="권기영">권기영</option></select></div>
      </div>
    </div>
    <div class="sheet-btns">
      <button class="btn-cancel-sheet" onclick="closeSheet()">취소</button>
      <button class="btn-save-sheet" onclick="savePatient()">저장</button>
    </div>
  </div>
</div>

<div class="confirm-backdrop" id="confirmBackdrop">
  <div class="confirm-box">
    <div class="confirm-title">병실 변경</div>
    <div class="confirm-msg">대기 병실로 변경합니다.</div>
    <div class="confirm-btns">
      <button class="btn-cc" onclick="closeConfirm()">취소</button>
      <button class="btn-cd" onclick="confirmDelete()">확인</button>
    </div>
  </div>
</div>

<div class="confirm-backdrop" id="dischargeBackdrop">
  <div class="confirm-box">
    <div class="confirm-title">퇴원환자 이동</div>

function pushHistory() {
  historyStack = historyStack.slice(0, historyIdx + 1);
  historyStack.push(JSON.stringify(all));
  historyIdx++;
  updateHistoryBtns();
}
function updateHistoryBtns() {
  document.getElementById('btn-undo').disabled = historyIdx <= 0;
  document.getElementById('btn-redo').disabled = historyIdx >= historyStack.length - 1;
}
window.undo = function() {
  if (historyIdx <= 0) return;
  historyIdx--;
  all = JSON.parse(historyStack[historyIdx]);
  persist(); render(); updateHistoryBtns(); toast('되돌렸습니다');
};
window.redo = function() {
  if (historyIdx >= historyStack.length - 1) return;
  historyIdx++;
  all = JSON.parse(historyStack[historyIdx]);

function fmtDate(d) { if (!d) return ''; return d.replace(/^20/, '').replace(/-/g, '/'); }
function today() { return new Date().toISOString().slice(0,10); }
window.toast = function(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 2000);
};

function calcDays(p) {
  if (p.admDate) {
    const adm = new Date(p.admDate);
    const now = new Date();
    adm.setHours(0,0,0,0); now.setHours(0,0,0,0);
    const diff = Math.floor((now - adm) / (1000*60*60*24)) + 1;
    return diff >= 1 ? diff : 1;
  }
  return parseInt(p.days) || 0;
}

function getEffectiveProgress(p) {
  if (p.progressNote === 'o') return 'o';
  if (p.progressNote === '-') return '-';
  const days = calcDays(p);
  // 가정형/재입원은 첫날부터 미비
  if (p.readmit === '가정형/재입원') return days >= 1 ? '-' : 'n';
  // 일반 환자는 4일째부터 미비
  return days > 3 ? '-' : 'n';
}
function getProgressClass(p) {
  const prog = getEffectiveProgress(p);
  if (prog === 'o') return 'mini-green';
  if (prog === '-') return 'mini-red';
  return 'mini-pink';
}

        <span class="mini-tag ${p.deathNote?'mini-green':'mini-red'}" ${canEditPatient(p)?`onclick="quickToggle(event,${p.id},'deathNote')"`:''} style="${canEditPatient(p)?'':'cursor:default;opacity:.7'}">임종</span>
        <span class="mini-tag ${p.readmit==='가정형/재입원'?'mini-gray':p.careConsult?'mini-green':'mini-red'}" ${canEditPatient(p)?`onclick="quickToggle(event,${p.id},'careConsult')"`:''} style="${canEditPatient(p)?'':'cursor:default;opacity:.7'}">돌봄</span>
        <span class="mini-tag ${getProgressClass(p)}" onclick="quickToggle(event,${p.id},'progressNote')">경과</span>

   ${(p.disease || p.note) ? `<div style="padding:4px 14px 8px;font-size:12px;color:var(--text2);border-top:0.5px solid var(--border)">${[p.disease, p.note].filter(Boolean).join(' | ')}</div>` : ''}

  // 통계 계산

  const careRed = currentWard === '85w' ? admitted.filter(p => (!p.careConsult || p.careConsult === '-') && p.readmit !== '가정형/재입원').length : 0;
  const progRed = currentWard === '85w' ? admitted.filter(p => getEffectiveProgress(p) === '-').length : 0;
  const redTotal = careRed + progRed;
  const pendingBlue = admitted.filter(p => getEffectiveProgress(p) === 'n').length;
  const dischargeLack = admitted.filter(p => !p.discharge).length;
  const deathLack = admitted.filter(p => !p.deathNote).length;

  // 탭별 레이아웃 전환
  const statsRow = document.getElementById('statsRow');
  if (isDischargeWard) {
    statsRow.style.gridTemplateColumns = 'repeat(2,1fr)';
    ['stat-card-total','stat-card-active','stat-card-wait','stat-card-pending'].forEach(id => document.getElementById(id).style.display = 'none');
    ['stat-card-discharge-lack','stat-card-death-lack'].forEach(id => document.getElementById(id).style.display = 'block');
  } else {
    statsRow.style.gridTemplateColumns = 'repeat(4,1fr)';
    ['stat-card-total','stat-card-active','stat-card-wait','stat-card-pending'].forEach(id => document.getElementById(id).style.display = 'block');
    ['stat-card-discharge-lack','stat-card-death-lack'].forEach(id => document.getElementById(id).style.display = 'none');
  }

  document.getElementById('stat-total').textContent = total;
  document.getElementById('stat-active').textContent = active;
  document.getElementById('stat-wait').textContent = redTotal;
  document.getElementById('stat-pending').textContent = pendingBlue;
  document.getElementById('stat-discharge-lack').textContent = dischargeLack;
  document.getElementById('stat-death-lack').textContent = deathLack;

  // 퇴원환자 탭 배지 업데이트
  const dischargePatients = all.filter(p => p.ward === '퇴원환자' && p.name && p.type !== '대기');
  const tabLack = dischargePatients.filter(p => !p.discharge || !p.deathNote).length;
  const badge = document.getElementById('badge-discharge');
  if (badge) {
    badge.textContent = tabLack;
    badge.style.display = tabLack > 0 ? 'inline' : 'none';
  }
  const el = document.getElementById('patientList');
  if (!list.length) { el.innerHTML = '<div class="empty-state"><div class="empty-icon">🛏️</div><div class="empty-text">등록된 환자가 없습니다<br>아래 + 버튼으로 추가하세요</div></div>'; return; }
  // 병실 그룹 정의
  const roomGroups = [
    ['850101'],
    ['850201','850202','850203','850204'],
    ['850301','850302','850303','850304'],
    ['850401','850402','850403','850404'],
    ['850501','850502','850503','850504'],
    ['850601'],
    ['850701','850702','850703'],
    ['850801','850802','850803','850804'],
    ['850901','850902','850903','850904'],
  ];

  // 병동 prefix (85w → 85, 75w → 75, 62w → 62)
  const prefix = currentWard === '62w' ? '62' : currentWard.replace('w','');

  // 그룹별로 렌더링
  if (isDischargeWard) {
    el.innerHTML = list.map(p => `<div style="border:1.5px solid var(--border2);border-radius:var(--radius-lg);margin-bottom:12px;overflow:hidden">${renderCard(p)}</div>`).join('');
    return;
  }

  // 그룹에 없는 환자도 표시
  const groupedRooms = new Set();
  const groupedHtml = roomGroups.map(group => {
    const rooms = group.map(r => r.replace('85', prefix));
    const patients = rooms.map(room => list.find(p => p.room === room)).filter(Boolean);
    patients.forEach(p => groupedRooms.add(p.id));
    if (!patients.length) return '';
    return `<div style="border:1.5px solid var(--border2);border-radius:var(--radius-lg);margin-bottom:12px;overflow:hidden">${patients.map(p => renderCard(p)).join('')}</div>`;
  }).join('');

  // 그룹에 포함되지 않은 환자 (병동 이동으로 추가된 환자 등)
  const ungrouped = list.filter(p => !groupedRooms.has(p.id));
  const ungroupedHtml = ungrouped.map(p => `<div style="border:1.5px solid var(--border2);border-radius:var(--radius-lg);margin-bottom:12px;overflow:hidden">${renderCard(p)}</div>`).join('');

  el.innerHTML = (groupedHtml + ungroupedHtml) || '<div class="empty-state"><div class="empty-icon">🛏️</div><div class="empty-text">등록된 환자가 없습니다<br>아래 + 버튼으로 추가하세요</div></div>';
  return;


  
}

window.toggleCard = function(id) {
  const body = document.getElementById('body-'+id), chev = document.getElementById('chev-'+id);
  chev.classList.toggle('open', body.classList.toggle('open'));
};
window.selectWard = function(ward, btn) {
  currentWard = ward;
  editMode = false;
  selectedIds.clear();
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  btn.classList.add('active');
  const editBtn = document.getElementById('btnWardEdit');
  editBtn.style.display = (ward === '75w' || ward === '62w' || ward === '퇴원환자') ? 'block' : 'none';
  editBtn.classList.remove('active');
  editBtn.textContent = '편집';
  editBtn.onclick = toggleEditMode;
  render();
};
window.quickToggle = function(e, id, field) {
  e.stopPropagation();
  const idx = all.findIndex(x => x.id === id);
  if (idx < 0) return;
  pushHistory();
  if (field === 'discharge') { const o=['','퇴원기록']; all[idx].discharge=o[(o.indexOf(all[idx].discharge)+1)%o.length]; }
  else if (field === 'deathNote') { const o=['','임종기록','임종 이외']; all[idx].deathNote=o[(o.indexOf(all[idx].deathNote)+1)%o.length]; }
  else if (field === 'careConsult') { all[idx].careConsult = all[idx].careConsult==='o'?'':'o'; }
  else if (field === 'progressNote') { all[idx].progressNote = getEffectiveProgress(all[idx])==='o'?'n':'o'; }
  persist(); render();
};

const FIELDS = ['room','type','name','days','disease','note','admDate','doctor','discharge','deathNote','careConsult','progressNote','readmit'];
window.openSheet = function(id) {
  document.getElementById('sheetTitle').textContent = id ? '환자 수정' : '환자 등록';
  document.getElementById('f_id').value = id || '';
  if (id) { const p = all.find(x => x.id===id); FIELDS.forEach(f => { const el=document.getElementById('f_'+f); if(el) el.value=p[f]||''; }); }
  else { FIELDS.forEach(f => { const el=document.getElementById('f_'+f); if(el) el.value=''; }); document.getElementById('f_type').value='대기'; document.getElementById('f_admDate').value=today(); }
  document.getElementById('sheetBackdrop').classList.add('open');
  updateEmptySelects();
};
window.closeSheet = function() { document.getElementById('sheetBackdrop').classList.remove('open'); };
window.onBackdropClick = function(e) { if(e.target===document.getElementById('sheetBackdrop')) window.closeSheet(); };
window.savePatient = function() {
  const room = document.getElementById('f_room').value.trim();
  if (!room) { alert('병실번호를 입력하세요.'); return; }
  pushHistory();
  const fid = document.getElementById('f_id').value, data = {};
  FIELDS.forEach(f => { const el=document.getElementById('f_'+f); data[f]=el?el.value.trim():''; });
  if (fid) { const idx=all.findIndex(x=>x.id==fid); if(idx>=0) all[idx]={...all[idx],...data}; toast('수정되었습니다'); }
  else { all.push({id:nid++,ward:currentWard,...data}); all.sort((a,b)=>a.room.localeCompare(b.room)); toast('등록되었습니다'); }
  persist(); window.closeSheet(); render();
};

window.askDel = function(id) { delId=id; document.getElementById('confirmBackdrop').classList.add('open'); };
window.closeConfirm = function() { document.getElementById('confirmBackdrop').classList.remove('open'); delId=null; };
window.confirmDelete = function() {
  pushHistory();
  const idx = all.findIndex(x=>x.id===delId);
  if(idx>=0) all[idx]={...all[idx],type:'대기',name:'',days:'',disease:'',note:'',admDate:'',doctor:'',discharge:'',deathNote:'',careConsult:'',progressNote:'n',readmit:''};
  persist(); window.closeConfirm(); render(); toast('대기 병실로 변경되었습니다');
};

let dischargeTargetId = null;
window.moveToDischarged = function(id) { dischargeTargetId=id; document.getElementById('dischargeBackdrop').classList.add('open'); };
window.closeDischarge = function() { document.getElementById('dischargeBackdrop').classList.remove('open'); dischargeTargetId=null; };
window.confirmDischarge = function() {
  pushHistory();
  const idx = all.findIndex(x=>x.id===dischargeTargetId);
  if(idx>=0) { const p=all[idx]; all.push({...p,id:nid++,ward:'퇴원환자'}); all[idx]={...p,type:'대기',name:'',days:'',disease:'',note:'',admDate:'',doctor:'',discharge:'',deathNote:'',careConsult:'',progressNote:'n',readmit:''}; }
  persist(); window.closeDischarge(); render(); toast('퇴원환자로 이동되었습니다');
};

let moveRoomTargetId = null;
let moveTargetWard = null;

window.openMoveRoom = function(id) {
  moveRoomTargetId = id;
  moveTargetWard = null;
  // 현재 병동에 따라 불필요한 버튼 숨기기
  document.getElementById('btn-move-75w').style.display = currentWard === '75w' ? 'none' : 'block';
  document.getElementById('btn-move-62w').style.display = currentWard === '62w' ? 'none' : 'block';
  document.getElementById('btn-move-85w').style.display = currentWard === '85w' ? 'none' : 'block';
  document.getElementById('moveStep1').style.display = 'block';
  document.getElementById('moveStep2').style.display = 'none';
  document.getElementById('moveRoomBackdrop').classList.add('open');
};

window.selectMoveWard = function(ward) {
  moveTargetWard = ward === 'same' ? currentWard : ward;
  document.getElementById('moveStep1').style.display = 'none';
  document.getElementById('moveStep2').style.display = 'block';

  if (ward === 'same') {
    // 같은 병동 → 빈 병실 드롭다운
    const emptyRooms = all.filter(p => p.ward === moveTargetWard && (!p.name || p.type === '대기')).sort((a,b) => a.room.localeCompare(b.room));
    if (!emptyRooms.length) {
      alert('이동 가능한 빈 병실이 없습니다.');
      document.getElementById('moveStep1').style.display = 'block';
      document.getElementById('moveStep2').style.display = 'none';
      return;
    }
    document.getElementById('moveStep2Label').textContent = '이동할 병실을 선택하세요.';
    document.getElementById('moveRoomListWrap').style.display = 'block';
    document.getElementById('moveRoomInputWrap').style.display = 'none';
    document.getElementById('moveRoomSelect').innerHTML = emptyRooms.map(p => `<option value="${p.id}">${p.room}</option>`).join('');
  } else {
    // 다른 병동 → 직접 입력
    document.getElementById('moveStep2Label').textContent = `[${moveTargetWard}] 이동할 병실번호를 입력하세요.`;
    document.getElementById('moveRoomListWrap').style.display = 'none';
    document.getElementById('moveRoomInputWrap').style.display = 'block';
    document.getElementById('moveRoomInput').value = '';
    setTimeout(() => document.getElementById('moveRoomInput').focus(), 100);
  }
};

window.backMoveStep1 = function() {
  document.getElementById('moveStep1').style.display = 'block';
  document.getElementById('moveStep2').style.display = 'none';
};

window.closeMoveRoom = function() {
  document.getElementById('moveRoomBackdrop').classList.remove('open');
  moveRoomTargetId = null;
  moveTargetWard = null;
};

window.confirmMoveRoom = function() {
  const sourceIdx = all.findIndex(p => p.id === moveRoomTargetId);
  if (sourceIdx < 0) return;
  const sp = all[sourceIdx];
  const sRoom = sp.room, sWard = sp.ward;

  const isInput = document.getElementById('moveRoomInputWrap').style.display !== 'none';

  if (isInput) {
    // 직접 입력한 병실번호로 이동
    const inputRoom = document.getElementById('moveRoomInput').value.trim();
    if (!inputRoom) { alert('병실번호를 입력하세요.'); return; }
    const targetIdx = all.findIndex(p => p.ward === moveTargetWard && p.room === inputRoom);
    if (targetIdx >= 0 && all[targetIdx].name && all[targetIdx].type !== '대기') {
      alert('환자가 있는 병실입니다.'); return;
    }
    pushHistory();
    if (targetIdx >= 0) {
      // 대상 병실(대기)이 있으면 → 환자를 대상 id로 이동, 원본은 대기로
      const targetId = all[targetIdx].id;
      all[targetIdx] = { ...sp, id: targetId, room: inputRoom, ward: moveTargetWard };
      all[sourceIdx] = { ...sp, type:'대기', room:sRoom, ward:sWard, name:'', days:'', disease:'', note:'', admDate:'', doctor:'', discharge:'', deathNote:'', careConsult:'', progressNote:'n', readmit:'' };
    } else {
      // 목록에 없는 병실 → room/ward만 변경, id 유지, 중복 제거
      all[sourceIdx] = { ...sp, room: inputRoom, ward: moveTargetWard };
      // 혹시 같은 room+ward 중복이 있으면 제거
      all = all.filter((p, i) => i === sourceIdx || !(p.room === inputRoom && p.ward === moveTargetWard && p.id !== sp.id));
      all.sort((a,b) => a.ward.localeCompare(b.ward) || a.room.localeCompare(b.room));
    }
    persist(); window.closeMoveRoom(); render();
    toast(`[${moveTargetWard}] ${inputRoom} 병실로 이동되었습니다`);
  } else {
    // 드롭다운에서 선택한 빈 병실로 이동
    const targetId = parseInt(document.getElementById('moveRoomSelect').value);
    const targetIdx = all.findIndex(p => p.id === targetId);
    if (targetIdx < 0) return;
    if (all[targetIdx].name && all[targetIdx].type !== '대기') { alert('환자가 있는 병실입니다.'); return; }
    pushHistory();
    const tRoom = all[targetIdx].room, tWard = all[targetIdx].ward;
    all[targetIdx] = { ...sp, room:tRoom, ward:tWard };
    all[sourceIdx] = { ...sp, type:'대기', room:sRoom, ward:sWard, name:'', days:'', disease:'', note:'', admDate:'', doctor:'', discharge:'', deathNote:'', careConsult:'', progressNote:'n', readmit:'' };
    persist(); window.closeMoveRoom(); render();
    toast(`[${tWard}] ${tRoom} 병실로 이동되었습니다`);
  }
};

window.saveNote = function(id, value) {
  const idx = all.findIndex(x => x.id === id);
  if (idx < 0) return;
  if (all[idx].note === value) return;
  pushHistory();
  all[idx].note = value;
  persist();
  toast('특이사항 저장됨');
};

  window.saveDeathNote = function(id, value) {
  const idx = all.findIndex(x => x.id === id);
  if (idx < 0) return;
  if (all[idx].deathNote === value) return;
  pushHistory();
  all[idx].deathNote = value;
  persist();
  render();
  toast('임종기록 저장됨');
};

function updateEmptySelects() {
  ['f_type','f_doctor'].forEach(id => {
    const el = document.getElementById(id);
    if (!el) return;
    const isEmpty = v => !v || v === '대기' || v === '-';
    el.classList.toggle('empty-select', isEmpty(el.value));
    el.addEventListener('change', () => el.classList.toggle('empty-select', isEmpty(el.value)));
  });
  ['f_admDate','f_name'].forEach(id => {
    const el = document.getElementById(id);
    if (!el) return;
    const update = () => { el.style.background = el.value ? '' : '#fffbeb'; el.style.borderColor = el.value ? '' : '#f59e0b'; };
    update();
    el.addEventListener('change', update);
    el.addEventListener('input', update);
  });
  const admDate = document.getElementById('f_admDate');
  if (admDate) {
    admDate.addEventListener('change', () => {
      const daysEl = document.getElementById('f_days');
      if (!daysEl || !admDate.value) return;
      const adm = new Date(admDate.value);
      const now = new Date();
      now.setHours(0,0,0,0);
      adm.setHours(0,0,0,0);
      const diff = Math.floor((now - adm) / (1000*60*60*24)) + 1;
      daysEl.value = diff >= 1 ? diff : 1;
    });
  }
}

let editMode = false;
let selectedIds = new Set();

window.toggleEditMode = function() {
  editMode = !editMode;
  selectedIds.clear();
  const btn = document.getElementById('btnWardEdit');
  btn.classList.toggle('active', editMode);
  btn.textContent = editMode ? `삭제(${selectedIds.size})` : '편집';
  render();
};

window.toggleSelectCard = function(e, id) {
  e.stopPropagation();
  if (!editMode) return;
  if (selectedIds.has(id)) selectedIds.delete(id);
  else selectedIds.add(id);
  const btn = document.getElementById('btnWardEdit');
  btn.textContent = selectedIds.size > 0 ? `삭제(${selectedIds.size})` : '편집 취소';
  // 카드 선택 표시
  const card = document.getElementById('card-'+id);
  if (card) card.classList.toggle('selected', selectedIds.has(id));
  if (selectedIds.size > 0) {
    btn.onclick = deleteSelected;
  } else {
    btn.onclick = toggleEditMode;
  }
};

function deleteSelected() {
  if (selectedIds.size === 0) return;
  pushHistory();
  all = all.filter(p => !selectedIds.has(p.id));
  persist();
  editMode = false;
  selectedIds.clear();
  const btn = document.getElementById('btnWardEdit');
  btn.classList.remove('active');
  btn.textContent = '편집';
  btn.onclick = toggleEditMode;
  render();
  toast(`${selectedIds.size === 0 ? '삭제되었습니다' : ''}`);
  toast('삭제되었습니다');
}

function updateAppBarHeight() {
  const bar = document.querySelector('.app-bar');
  if (bar) document.documentElement.style.setProperty('--app-bar-height', bar.offsetHeight + 'px');
}
updateAppBarHeight();
window.addEventListener('resize', updateAppBarHeight);
  
function updateDate() {
  const d=new Date();
  document.getElementById('dateDisplay').textContent=`${d.getMonth()+1}/${d.getDate()} (${['일','월','화','수','목','금','토'][d.getDay()]})`;
}
updateDate();
</script>
