<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#ffffff">
<title>병동 환자 관리</title>
<style>
  :root {
    --bg: #f5f5f7;
    --surface: #ffffff;
    --surface2: #f0f0f5;
    --border: #e0e0e8;
    --border2: #c8c8d8;
    --text: #1a1a2e;
    --text2: #555577;
    --text3: #999aaa;
    --accent: #2563eb;
    --accent-bg: #eff6ff;
    --accent-text: #1d4ed8;
    --success: #16a34a;
    --success-bg: #f0fdf4;
    --success-text: #15803d;
    --danger: #dc2626;
    --danger-bg: #fef2f2;
    --danger-text: #b91c1c;
    --radius-sm: 8px;
    --radius-md: 12px;
    --radius-lg: 16px;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f0f14;
      --surface: #1c1c28;
      --surface2: #252535;
      --border: #2e2e42;
      --border2: #3e3e58;
      --text: #e8e8f0;
      --text2: #9090b0;
      --text3: #55556a;
      --accent: #3b82f6;
      --accent-bg: #1e2d4a;
      --accent-text: #93c5fd;
      --success-bg: #0d2a1a;
      --success-text: #6ee7b7;
      --danger-bg: #2a0d0d;
      --danger-text: #fca5a5;
    }
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  body {
    font-family: -apple-system, 'Malgun Gothic', '맑은 고딕', BlinkMacSystemFont, sans-serif;
    background: var(--bg);
    color: var(--text);
    font-size: 14px;
    min-height: 100dvh;
    overscroll-behavior: none;
  }

  .app-bar {
    position: sticky;
    top: 0;
    z-index: 30;
    background: var(--surface);
    border-bottom: 0.5px solid var(--border);
    padding: env(safe-area-inset-top) 0 0;
  }
  .app-bar-inner {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 16px;
    gap: 10px;
  }
  .app-title { font-size: 17px; font-weight: 600; color: var(--text); }

  .ward-tabs {
    display: flex;
    gap: 4px;
    padding: 0 16px 10px;
    overflow-x: auto;
    scrollbar-width: none;
  }
  .ward-tabs::-webkit-scrollbar { display: none; }
  .tab {
    padding: 6px 16px;
    border-radius: 20px;
    border: 0.5px solid var(--border2);
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    background: var(--surface);
    color: var(--text2);
    white-space: nowrap;
    transition: all .15s;
  }
  .tab.active {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
  }

  .stats-row {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    padding: 12px 16px;
  }
  .stat-card {
    background: var(--surface);
    border-radius: var(--radius-md);
    padding: 12px 10px;
    text-align: center;
    border: 0.5px solid var(--border);
  }
  .stat-num { font-size: 24px; font-weight: 600; line-height: 1; }
  .stat-lbl { font-size: 11px; color: var(--text2); margin-top: 4px; }
  .stat-active { color: var(--success); }
  .stat-wait { color: var(--text3); }

  .section-label {
    padding: 6px 16px 6px;
    font-size: 12px;
    font-weight: 600;
    color: var(--text3);
    letter-spacing: .5px;
    text-transform: uppercase;
  }

  .patient-list { padding: 0 16px 100px; }
  .patient-card {
    background: var(--surface);
    border: 0.5px solid var(--border);
    border-radius: var(--radius-lg);
    margin-bottom: 10px;
    overflow: hidden;
  }
  .patient-card.is-waiting { opacity: .5; }

  .card-header {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 13px 14px;
    cursor: pointer;
    user-select: none;
    -webkit-user-select: none;
  }
  .card-header:active { background: var(--surface2); }

  .badge {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    font-weight: 600;
    padding: 3px 8px;
    border-radius: 6px;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .badge-m { background: var(--accent-bg); color: var(--accent-text); }
  .badge-f { background: var(--danger-bg); color: var(--danger-text); }
  .badge-wait { background: var(--surface2); color: var(--text3); }

  .card-room { font-size: 12px; color: var(--text2); flex-shrink: 0; }
  .card-name { font-size: 15px; font-weight: 500; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .card-days { font-size: 12px; color: var(--text2); flex-shrink: 0; }
  .chevron { font-size: 18px; color: var(--text3); transition: transform .2s; flex-shrink: 0; }
  .chevron.open { transform: rotate(180deg); }

  .card-body {
    border-top: 0.5px solid var(--border);
    display: none;
    padding: 12px 14px;
  }
  .card-body.open { display: block; }

  .info-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px 14px;
  }
  .info-item { display: flex; flex-direction: column; gap: 2px; }
  .info-item.full { grid-column: 1/-1; }
  .info-lbl { font-size: 10px; font-weight: 600; color: var(--text3); letter-spacing: .3px; }
  .info-val { font-size: 13px; color: var(--text); }
  .info-val.muted { color: var(--text3); }

  .chip {
    display: inline-flex;
    align-items: center;
    gap: 3px;
    padding: 2px 8px;
    border-radius: 6px;
    font-size: 12px;
    font-weight: 500;
  }
  .chip-blue { background: var(--accent-bg); color: var(--accent-text); }
  .chip-green { background: var(--success-bg); color: var(--success-text); }

  .card-actions {
    display: flex;
    gap: 8px;
    margin-top: 12px;
    justify-content: flex-end;
  }
  .btn-edit {
    padding: 7px 18px;
    border-radius: var(--radius-sm);
    border: 0.5px solid var(--border2);
    background: var(--surface2);
    color: var(--text);
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
  }
  .btn-del {
    padding: 7px 18px;
    border-radius: var(--radius-sm);
    border: 0.5px solid var(--danger);
    background: var(--danger-bg);
    color: var(--danger-text);
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
  }
  .btn-edit:active { opacity: .7; }
  .btn-del:active { opacity: .7; }

  .fab {
    position: fixed;
    bottom: calc(24px + env(safe-area-inset-bottom));
    right: 20px;
    width: 56px;
    height: 56px;
    border-radius: 50%;
    background: var(--accent);
    color: #fff;
    border: none;
    font-size: 28px;
    font-weight: 300;
    cursor: pointer;
    box-shadow: 0 4px 16px rgba(37,99,235,.35);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 20;
    transition: transform .15s;
  }
  .fab:active { transform: scale(.92); }

  .sheet-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.45);
    z-index: 50;
    display: none;
    align-items: flex-end;
  }
  .sheet-backdrop.open { display: flex; }

  .sheet {
    background: var(--surface);
    border-radius: 20px 20px 0 0;
    width: 100%;
    max-height: 92dvh;
    overflow-y: auto;
    padding-bottom: calc(24px + env(safe-area-inset-bottom));
    animation: slideUp .22s cubic-bezier(.32,.72,0,1);
    -webkit-overflow-scrolling: touch;
  }
  @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }

  .sheet-handle {
    width: 36px;
    height: 4px;
    background: var(--border2);
    border-radius: 2px;
    margin: 12px auto 0;
  }
  .sheet-title {
    padding: 12px 18px 12px;
    font-size: 16px;
    font-weight: 600;
    border-bottom: 0.5px solid var(--border);
  }
  .sheet-body { padding: 16px 18px 0; }

  .form-group { margin-bottom: 14px; }
  .form-group label {
    display: block;
    font-size: 12px;
    font-weight: 600;
    color: var(--text2);
    margin-bottom: 5px;
  }
  .form-group input,
  .form-group select {
    width: 100%;
    padding: 11px 12px;
    border-radius: var(--radius-sm);
    border: 0.5px solid var(--border2);
    background: var(--surface2);
    color: var(--text);
    font-size: 15px;
    font-family: inherit;
    outline: none;
    -webkit-appearance: none;
    appearance: none;
  }
  .form-group input:focus,
  .form-group select:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(37,99,235,.15);
  }
  .form-row {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
  }

  .sheet-btns {
    display: flex;
    gap: 10px;
    padding: 14px 18px 0;
    border-top: 0.5px solid var(--border);
    margin-top: 16px;
  }
  .btn-cancel-sheet {
    flex: 1;
    padding: 12px;
    border-radius: var(--radius-sm);
    border: 0.5px solid var(--border2);
    background: var(--surface2);
    color: var(--text);
    font-size: 15px;
    font-weight: 500;
    cursor: pointer;
  }
  .btn-save-sheet {
    flex: 2;
    padding: 12px;
    border-radius: var(--radius-sm);
    border: none;
    background: var(--accent);
    color: #fff;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
  }
  .btn-cancel-sheet:active, .btn-save-sheet:active { opacity: .8; }

  .confirm-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.5);
    z-index: 60;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .confirm-backdrop.open { display: flex; }
  .confirm-box {
    background: var(--surface);
    border-radius: var(--radius-lg);
    padding: 22px 20px 18px;
    width: 100%;
    max-width: 320px;
  }
  .confirm-title { font-size: 16px; font-weight: 600; margin-bottom: 6px; }
  .confirm-msg { font-size: 13px; color: var(--text2); margin-bottom: 18px; line-height: 1.5; }
  .confirm-btns { display: flex; gap: 8px; }
  .btn-cc {
    flex: 1; padding: 10px;
    border-radius: var(--radius-sm);
    border: 0.5px solid var(--border2);
    background: var(--surface2);
    color: var(--text);
    font-size: 14px;
    cursor: pointer;
  }
  .btn-cd {
    flex: 1; padding: 10px;
    border-radius: var(--radius-sm);
    border: none;
    background: var(--danger);
    color: #fff;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }

  .empty-state {
    text-align: center;
    padding: 48px 20px;
    color: var(--text3);
  }
  .empty-icon { font-size: 44px; margin-bottom: 12px; }
  .empty-text { font-size: 14px; }

  .toast {
    position: fixed;
    bottom: calc(90px + env(safe-area-inset-bottom));
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--text);
    color: var(--surface);
    padding: 10px 20px;
    border-radius: 24px;
    font-size: 13px;
    font-weight: 500;
    white-space: nowrap;
    opacity: 0;
    transition: all .25s;
    z-index: 80;
    pointer-events: none;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  .badge-dr-kim { background: #e0f0ff; color: #1a5fa8; font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 6px; flex-shrink: 0; }
  .badge-dr-kwon { background: #f0e8ff; color: #6b21a8; font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 6px; flex-shrink: 0; }
  
</style>
</head>

<div class="section-label" id="sectionLabel">85w 병동</div>

<button class="fab" onclick="openSheet(null)" aria-label="환자 추가">+</button>

<div class="sheet-backdrop" id="sheetBackdrop" onclick="onBackdropClick(event)">
  <div class="sheet" onclick="event.stopPropagation()">

    <div class="sheet-body">
      <input type="hidden" id="f_id">
      <div class="form-row">

            <option value="성인여">성인(여)</option>
          </select>
        </div>
      </div>
      <div class="form-row">

        </div>
        <div class="form-group">
          <label>재원일수</label>
          <input type="number" id="f_days" placeholder="0" min="0" inputmode="numeric">
        </div>
      </div>
      <div class="form-group">
        <label>병명</label>
        <input type="text" id="f_disease" placeholder="예) Rectal ca.">
      </div>
      <div class="form-group">
        <label>특이사항</label>
        <input type="text" id="f_note" placeholder="예) 장루, 낙상위험 등">
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>입원일</label>
          <input type="date" id="f_admDate">
        </div>
        <div class="form-group">
          <label>담당의</label>
          <select id="f_doctor">
            <option value="">-</option>
            <option value="김성민">김성민</option>
            <option value="권기영">권기영</option>
          </select>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>퇴원구분</label>
          <select id="f_discharge">
            <option value="">-</option>
            <option value="퇴원X">퇴원X</option>
            <option value="퇴원O">퇴원O</option>
            <option value="전원">전원</option>
          </select>
        </div>
        
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>차트번호</label>
          <input type="text" id="f_chart" placeholder="850204">
        </div>
        
      </div>
      <div class="form-row">
        
        
      </div>
      
    </div>
    <div class="sheet-btns">
      <button class="btn-cancel-sheet" onclick="closeSheet()">취소</button>
      <button class="btn-save-sheet" onclick="savePatient()">저장</button>
    </div>
  </div>
</div>

<div class="confirm-backdrop" id="confirmBackdrop">
  <div class="confirm-box">
    <div class="confirm-title">환자 삭제</div>
    <div class="confirm-msg">이 환자 기록을 삭제할까요?<br>삭제 후 복구할 수 없습니다.</div>
    <div class="confirm-btns">
      <button class="btn-cc" onclick="closeConfirm()">취소</button>
      <button class="btn-cd" onclick="confirmDelete()">삭제</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

function load() {
  try { const r = localStorage.getItem(KEY); return r ? JSON.parse(r) : JSON.parse(JSON.stringify(SAMPLE)); }
  catch(e) { return JSON.parse(JSON.stringify(SAMPLE)); }
}
function persist() {
  try { localStorage.setItem(KEY, JSON.stringify(all)); } catch(e) {}
}

function fmtDate(d) {
  if (!d) return '';
  return d.replace(/^20/, '').replace(/-/g, '/');
}
function today() { return new Date().toISOString().slice(0,10); }

function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 2000);
}

function render() {
  const list = all.filter(p => p.ward === currentWard).sort((a,b) => a.room.localeCompare(b.room));
  document.getElementById('sectionLabel').textContent = currentWard + ' 병동';

  const active = list.filter(p => p.name && p.type !== '대기').length;
  const wait = list.filter(p => !p.name || p.type === '대기').length;
  document.getElementById('stat-total').textContent = list.length;
  document.getElementById('stat-active').textContent = active;
  document.getElementById('stat-wait').textContent = wait;

  const el = document.getElementById('patientList');
  if (!list.length) {
    el.innerHTML = '<div class="empty-state"><div class="empty-icon">🛏️</div><div class="empty-text">등록된 환자가 없습니다<br>아래 + 버튼으로 추가하세요</div></div>';
    return;
  }

  el.innerHTML = list.map(p => {
    const isWait = !p.name || p.type === '대기';
    const bc = p.type === '성인남' ? 'badge-m' : p.type === '성인여' ? 'badge-f' : 'badge-wait';
    const bt = p.type === '성인남' ? '남' : p.type === '성인여' ? '여' : '대기';

    const disHtml = p.discharge
      ? `<span class="chip ${p.discharge === '퇴원X' ? 'chip-blue' : 'chip-green'}">${p.discharge}</span>`
      : '<span class="info-val muted">-</span>';
    const surHtml = p.surgery === 'O'
      ? '<span class="chip chip-green">✓ 완료</span>'
      : p.surgery ? `<span class="info-val">${p.surgery}</span>` : '<span class="info-val muted">-</span>';

    return `
    <div class="patient-card${isWait ? ' is-waiting' : ''}" id="card-${p.id}">
      <div class="card-header" onclick="toggleCard(${p.id})">
        ${p.doctor === '김성민' ? '<span class="badge-dr-kim">김</span>' : p.doctor === '권기영' ? '<span class="badge-dr-kwon">권</span>' : ''}
        <span class="badge ${bc}">${bt}</span>
        <span class="card-room">${p.room}</span>
        <span class="card-name">${p.name || '<span style="color:var(--text3);font-size:13px">대기</span>'}</span>
        ${p.days ? `<span class="card-days">${p.days}일</span>` : ''}
        <span class="chevron" id="chev-${p.id}">⌄</span>
      </div>
      <div class="card-body" id="body-${p.id}">
        <div class="info-grid">
          <div class="info-item"><span class="info-lbl">병명</span><span class="info-val${!p.disease?' muted':''}\">${p.disease||'-'}</span></div>
          <div class="info-item"><span class="info-lbl">특이사항</span><span class="info-val${!p.note?' muted':''}\">${p.note||'-'}</span></div>
          <div class="info-item"><span class="info-lbl">입원일</span><span class="info-val${!p.admDate?' muted':''}\">${fmtDate(p.admDate)||'-'}</span></div>
          <div class="info-item"><span class="info-lbl">담당의</span><span class="info-val${!p.doctor?' muted':''}\">${p.doctor||'-'}</span></div>
          <div class="info-item"><span class="info-lbl">퇴원구분</span>${disHtml}</div>
          <div class="info-item"><span class="info-lbl">퇴원예정일</span><span class="info-val${!p.disDate?' muted':''}\">${fmtDate(p.disDate)||'-'}</span></div>
          <div class="info-item"><span class="info-lbl">수술확인</span>${surHtml}</div>
          <div class="info-item"><span class="info-lbl">다음예정</span><span class="info-val${!p.next?' muted':''}\">${fmtDate(p.next)||'-'}</span></div>
          <div class="info-item"><span class="info-lbl">차트번호</span><span class="info-val${!p.chart?' muted':''}\">${p.chart||'-'}</span></div>
          <div class="info-item"><span class="info-lbl">담당간호사</span><span class="info-val${!p.nurse?' muted':''}\">${p.nurse||'-'}</span></div>
          ${p.remark ? `<div class="info-item full"><span class="info-lbl">비고</span><span class="info-val">${p.remark}</span></div>` : ''}
        </div>
        <div class="card-actions">
          <button class="btn-del" onclick="askDel(${p.id})">삭제</button>
          <button class="btn-edit" onclick="openSheet(${p.id})">수정</button>
        </div>
      </div>
    </div>`;
  }).join('');
}

function toggleCard(id) {
  const body = document.getElementById('body-' + id);
  const chev = document.getElementById('chev-' + id);
  const open = body.classList.toggle('open');
  chev.classList.toggle('open', open);
}

function selectWard(ward, btn) {
  currentWard = ward;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  btn.classList.add('active');
  render();
}

const FIELDS = ['room','type','name','days','disease','note','admDate','doctor','discharge','disDate','chart','nurse','surgery','next','remark'];

function openSheet(id) {
  document.getElementById('sheetTitle').textContent = id ? '환자 수정' : '환자 등록';
  document.getElementById('f_id').value = id || '';
  if (id) {
    const p = all.find(x => x.id === id);
    FIELDS.forEach(f => { const el = document.getElementById('f_' + f); if (el) el.value = p[f] || ''; });
  } else {
    FIELDS.forEach(f => { const el = document.getElementById('f_' + f); if (el) el.value = ''; });
    document.getElementById('f_type').value = '대기';
    document.getElementById('f_admDate').value = today();
    document.getElementById('f_doctor').value = '';
  }
  document.getElementById('sheetBackdrop').classList.add('open');
  document.getElementById('f_room').focus();
}
function closeSheet() { document.getElementById('sheetBackdrop').classList.remove('open'); }
function onBackdropClick(e) { if (e.target === document.getElementById('sheetBackdrop')) closeSheet(); }

function savePatient() {
  const room = document.getElementById('f_room').value.trim();
  if (!room) { alert('병실번호를 입력하세요.'); return; }
  const fid = document.getElementById('f_id').value;
  const data = {};
  FIELDS.forEach(f => { const el = document.getElementById('f_' + f); data[f] = el ? el.value.trim() : ''; });
  if (fid) {
    const idx = all.findIndex(x => x.id == fid);
    if (idx >= 0) all[idx] = { ...all[idx], ...data };
    toast('수정되었습니다');
  } else {
    all.push({ id: nid++, ward: currentWard, ...data });
    all.sort((a,b) => a.room.localeCompare(b.room));
    toast('등록되었습니다');
  }
  persist();
  closeSheet();
  render();
}

function askDel(id) { delId = id; document.getElementById('confirmBackdrop').classList.add('open'); }
function closeConfirm() { document.getElementById('confirmBackdrop').classList.remove('open'); delId = null; }
function confirmDelete() {
  all = all.filter(x => x.id !== delId);
  persist(); closeConfirm(); render();
  toast('삭제되었습니다');
}

function updateDate() {
  const d = new Date();
  document.getElementById('dateDisplay').textContent =
    `${d.getMonth()+1}/${d.getDate()} (${['일','월','화','수','목','금','토'][d.getDay()]})`;
}

all = load();
updateDate();
render();
</script>
</body>
